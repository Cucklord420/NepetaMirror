name: Mirror integrity

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Verify repository indexes and package checksums (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/verify-repository/Cargo.toml -- --check
      - name: Check Rust Clippy warnings
        run: cargo clippy --manifest-path rust/verify-repository/Cargo.toml --locked --all-targets -- -D warnings
      - name: Rust unit and mirror content self-tests
        run: cargo test --manifest-path rust/verify-repository/Cargo.toml --locked
      - name: Rust mirror verifier (full on-disk archive checks)
        run: cargo run --quiet --manifest-path rust/verify-repository/Cargo.toml --locked
