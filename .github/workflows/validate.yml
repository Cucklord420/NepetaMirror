name: Mirror integrity

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Verify repository indexes and package checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Rust unit and mirror content self-tests
        run: cargo test --manifest-path rust/verify-repository/Cargo.toml
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/verify-repository/Cargo.toml -- --check
      - name: Check Rust Clippy warnings
        run: cargo clippy --manifest-path rust/verify-repository/Cargo.toml --all-targets -- -D warnings
      - name: Rust mirror verifier (full on-disk archive checks)
        run: cargo run --quiet --manifest-path rust/verify-repository/Cargo.toml
