name: Mirror integrity

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Verify repository indexes and package checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Original Python mirror verifier (parity reference)
        run: python3 scripts/verify_repository.py
      - name: Rust unit and mirror content self-tests
        run: cargo test --manifest-path rust/verify-repository/Cargo.toml
      - name: Rust mirror verifier (full on-disk archive checks)
        run: cargo run --quiet --manifest-path rust/verify-repository/Cargo.toml
